name: Build Android APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK 36
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || "$SDKMGR" "platform-tools" "platforms;android-36"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Carrom-Hub.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carrom-Hub-APK
          path: release-assets/Carrom-Hub.apk

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" release-assets/Carrom-Hub.apk \
            --title "Carrom Hub $TAG (Android APK)" \
            --notes "Carrom Hub Android APK built from commit ${{ github.sha }}. Includes Microphone (Voice), Camera & Photo permissions, Inbox messaging, clickable links, and real-time sync." \
            --latest
